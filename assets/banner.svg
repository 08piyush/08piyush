<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Piyush Pancholi | Data and AI Engineer</title>
  <desc id="description">An ivory and charcoal banner with lime accents. Turning data into what's next. A pipeline connects raw data, trusted foundations, and intelligent outcomes.</desc>
  <defs>
